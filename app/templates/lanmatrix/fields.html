{% extends "lanmatrix/base_lm.html" %}
{% block title %}字段配置{% endblock %}
{% block crumb %}<a href="{{ url_for('lanmatrix_pages.projects') }}">项目</a><span class="sep">/</span><b>字段配置</b>{% endblock %}
{% block content %}
<div class="content lm-fields" data-project-id="{{ project_id }}">
  <div class="page-head">
    <div class="ttl">
      <h1>字段配置</h1>
      <p>定义测试项的动态字段，拖拽调整顺序，编辑器列顺序随之更新</p>
    </div>
    <div class="head-actions">
      <button class="btn primary" id="lm-add-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>新增字段
      </button>
    </div>
  </div>

  <div class="tablecard">
    <div class="tc-head">
      <h3>字段列表</h3>
      <span class="muted" style="font-size:12.5px">拖动 <span style="letter-spacing:-2px">⠿</span> 可排序</span>
    </div>
    <div style="overflow-x:auto">
      <table class="dt lm-fields-table">
        <thead>
          <tr><th style="width:1%"></th><th>Sheet</th><th>标识</th><th>显示名</th>
            <th>类型</th><th>必填</th><th>只读</th><th>选项 / 提示</th><th style="width:1%"></th></tr>
        </thead>
        <tbody id="lm-fields-rows"><tr><td colspan="9" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<dialog id="lm-field-dialog" class="lm-dialog">
  <form method="dialog" class="lm-card" style="padding:22px;min-width:420px;display:flex;flex-direction:column;gap:12px">
    <h3 id="lm-field-dialog-title" style="font-size:17px">新增字段</h3>
    <div class="field"><label>字段标识（英文）</label><input id="lm-f-key" required placeholder="test_env"></div>
    <div class="field"><label>显示名称</label><input id="lm-f-name" placeholder="测试环境"></div>
    <div class="field"><label>所在 Sheet 页</label>
      <select id="lm-f-sheet" class="selbox">
        <option value="test">test（测试用例）</option>
        <option value="const">const（常量）</option>
        <option value="lib">lib（函数库）</option>
      </select>
    </div>
    <div class="field"><label>数据类型</label>
      <select id="lm-f-type" class="selbox">
        <option value="text">文本</option>
        <option value="multiline">多行文本</option>
        <option value="integer">整数</option>
        <option value="decimal">小数</option>
        <option value="boolean">布尔</option>
        <option value="date">日期</option>
        <option value="datetime">日期时间</option>
        <option value="single_select">单选</option>
        <option value="multi_select">多选</option>
        <option value="user">用户</option>
        <option value="url">链接</option>
        <option value="hex">十六进制</option>
        <option value="steps">测试手顺（手順明细）</option>
      </select>
    </div>
    <div class="field"><label>选项（逗号分隔，用于单选/多选）</label><input id="lm-f-options"></div>
    <div class="field"><label>提示文本</label><input id="lm-f-help"></div>
    <label class="lm-inline" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="lm-f-required"> <span>必填</span></label>
    <div class="login-err" id="lm-f-error" hidden></div>
    <menu style="display:flex;gap:10px;justify-content:flex-end;margin:0;padding:0">
      <button value="cancel" formnovalidate class="btn">取消</button>
      <button value="ok" id="lm-f-ok" class="btn primary">创建</button>
    </menu>
  </form>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/lanmatrix/fields.js') }}"></script>
{% endblock %}
