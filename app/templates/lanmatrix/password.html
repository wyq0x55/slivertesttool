{% extends "lanmatrix/base_lm.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="login-wrap">
  <aside class="login-aside">
    <div class="la-brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-4.5 8A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-2.9L14 9V3"/></svg></span>
      <span>Test Platform</span>
    </div>
    <div class="la-mid">
      <h2>请更换登录密码</h2>
      <p>{% if must_change %}当前账号仍在使用初始密码。修改完成前，不能进入项目或调用其他接口。{% else %}修改后，此前签发的个人 API Token 会立即失效。{% endif %}</p>
    </div>
  </aside>
  <main class="login-main">
    <form id="lm-password-form" class="login-card" autocomplete="off">
      <h1>修改密码</h1>
      <p class="sub">至少 {{ password_min_len }} 位，且不能与当前密码相同</p>
      <div class="login-err" id="lm-password-error" hidden></div>
      <div class="field">
        <label>当前密码</label>
        <input type="password" id="lm-current-password" required autocomplete="current-password" placeholder="输入当前密码">
      </div>
      <div class="field">
        <label>新密码</label>
        <input type="password" id="lm-new-password" required minlength="{{ password_min_len }}" autocomplete="new-password" placeholder="输入新密码">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="lm-confirm-password" required minlength="{{ password_min_len }}" autocomplete="new-password" placeholder="再次输入新密码">
      </div>
      <button type="submit" class="btn primary">保存新密码</button>
      <p class="alt"><a href="{{ url_for('lanmatrix_pages.logout') }}">退出登录</a></p>
    </form>
  </main>
</div>
<script>
document.getElementById('lm-password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('lm-password-error');
  err.hidden = true;
  const next = document.getElementById('lm-new-password').value;
  const confirm = document.getElementById('lm-confirm-password').value;
  if (next !== confirm) {
    err.textContent = '两次输入的新密码不一致';
    err.hidden = false;
    return;
  }
  const button = e.target.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    await LMReady;
    await LMApi.changePassword(document.getElementById('lm-current-password').value, next);
    window.location = LM.urls.home || LM.urls.projects;
  } catch (ex) {
    err.textContent = ex.message || '修改失败';
    err.hidden = false;
  } finally {
    button.disabled = false;
  }
});
</script>
{% endblock %}
