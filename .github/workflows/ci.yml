name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / PostgreSQL + mock
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silvetestapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d silvetestapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/silvetestapp_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/silvetestapp_test
      HUEY_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/silvetestapp_test
      RUNNER_BACKEND: mock
      HUEY_IMMEDIATE: "1"
      GLOBAL_LOGIN_REQUIRED: "0"
      SECRET_KEY: ci-only-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.18"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile/import sanity
        run: |
          python -m compileall -q app
          python -m py_compile run.py run_web.py run_worker.py run_collab.py manage.py

      - name: Run backend test suite
        run: python -m pytest -q

  frontend:
    name: Frontend / production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend bundles
        working-directory: frontend
        run: npm run build
