name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # setup-python has no Windows build of 3.10.18.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.15'
      - name: Install CPython 3.10.18
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:ProgramData 'SilverBuildPython'
          uv python install 3.10.18 --no-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = uv python find 3.10.18 --managed-python --no-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUILD_PYTHON=$python" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Build and verify offline package
        env:
          RELEASE_ID: ${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}
        run: '& $env:BUILD_PYTHON deployment/build_windows_release.py $env:RELEASE_ID dist'
      - name: Exercise Windows services, upgrade and rollback
        shell: powershell
        run: |
          $package = Get-Item dist/*.zip
          .\deployment\smoke_windows_release.ps1 -Package $package.FullName -Python $env:BUILD_PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.ref_name }}
        run: gh release create "$RELEASE_ID" --verify-tag --generate-notes dist/*
